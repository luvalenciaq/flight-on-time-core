spring.application.name=core-service
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/flight_on_time
spring.datasource.username=postgres
spring.datasource.password=Eli123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
spring.flyway.clean-disabled=true
spring.flyway.schemas=public
spring.datasource.hikari.connection-init-sql=SET search_path TO public

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

logging.level.org.apache.coyote.http11=ERROR